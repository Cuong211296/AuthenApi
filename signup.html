<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Identify Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .signup-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #667eea;
            background: none;
            border: none;
            font-size: 16px;
            padding: 8px;
            z-index: 10;
            pointer-events: auto;
        }

        .toggle-password:hover {
            color: #764ba2;
        }

        .input-icon {
            position: relative;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .signup-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1><i class="fas fa-user-plus"></i> Tạo Tài Khoản</h1>
            <p>Đăng ký tài khoản mới cho Identify Service</p>
        </div>

        <div class="signup-body">
            <div id="alertContainer"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Tên đăng nhập
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập (3+ ký tự)"
                        required
                        minlength="3"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstname">
                            <i class="fas fa-user-circle"></i> Tên
                        </label>
                        <input
                            type="text"
                            id="firstname"
                            name="firstname"
                            placeholder="Tên của bạn"
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastname">
                            <i class="fas fa-user-circle"></i> Họ
                        </label>
                        <input
                            type="text"
                            id="lastname"
                            name="lastname"
                            placeholder="Họ của bạn"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob">
                        <i class="fas fa-calendar"></i> Ngày sinh
                    </label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Mật khẩu
                    </label>
                    <div class="input-icon" style="position: relative;">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nhập mật khẩu (8+ ký tự)"
                            required
                            minlength="8"
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Xác nhận mật khẩu
                    </label>
                    <div class="input-icon" style="position: relative;">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Nhập lại mật khẩu"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="signup-btn" id="signupBtn">
                    <i class="fas fa-user-plus"></i>
                    <span id="btnText">Tạo Tài Khoản</span>
                </button>
            </form>

            <div class="login-link">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/identity';
        const signupForm = document.getElementById('signupForm');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const signupBtn = document.getElementById('signupBtn');
        const alertContainer = document.getElementById('alertContainer');

        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePasswordBtn.innerHTML = `<i class="fas fa-eye${type === 'password' ? '' : '-slash'}"></i>`;
        });

        toggleConfirmPasswordBtn.addEventListener('click', () => {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            toggleConfirmPasswordBtn.innerHTML = `<i class="fas fa-eye${type === 'password' ? '' : '-slash'}"></i>`;
        });

        // Form submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const firstname = document.getElementById('firstname').value.trim();
            const lastname = document.getElementById('lastname').value.trim();
            const dob = document.getElementById('dob').value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (username.length < 3) {
                showAlert('Tên đăng nhập phải có ít nhất 3 ký tự', 'error');
                return;
            }

            if (password.length < 8) {
                showAlert('Mật khẩu phải có ít nhất 8 ký tự', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Mật khẩu không khớp', 'error');
                return;
            }

            if (!dob) {
                showAlert('Vui lòng chọn ngày sinh', 'error');
                return;
            }

            try {
                setLoading(true);

                const response = await axios.post(`${API_BASE}/users`, {
                    username,
                    firstname,
                    lastname,
                    password,
                    dob
                });

                showAlert('Đăng ký thành công! Đang chuyển hướng...', 'success');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                let errorMessage = 'Đăng ký thất bại';

                if (error.response) {
                    const { code, message } = error.response.data;

                    if (code === 1001) {
                        errorMessage = 'Tên đăng nhập đã tồn tại';
                    } else if (code === 1003) {
                        errorMessage = 'Tên đăng nhập không hợp lệ';
                    } else {
                        errorMessage = message || errorMessage;
                    }
                } else if (error.request) {
                    errorMessage = 'Không thể kết nối đến server';
                }

                showAlert(errorMessage, 'error');
                console.error('Signup error:', error);
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            signupBtn.disabled = isLoading;
            if (isLoading) {
                signupBtn.innerHTML = '<span class="loading-spinner"></span> Đang tạo tài khoản...';
            } else {
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>Tạo Tài Khoản</span>';
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i>
                ${message}
            `;

            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.opacity = '0';
                alertDiv.style.transform = 'translateY(-10px)';
                setTimeout(() => alertDiv.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
