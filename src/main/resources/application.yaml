server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/identity}
  tomcat:
    # Let Tomcat drain an oversized upload so the client gets the clean 413 instead of a reset connection.
    max-swallow-size: 20MB

spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/identity_service}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD}"
    driver-class-name: "${DB_DRIVER:com.mysql.cj.jdbc.Driver}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

jwt:
  signerKey: "${JWT_SIGNER_KEY}"

shop:
  admin-password: "${ADMIN_PASSWORD}"
  mail-from: ${MAIL_FROM:no-reply@shop.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  order-expiry-minutes: 15

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:INFO}

momo:
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn}
  partner-code: ${MOMO_PARTNER_CODE:}
  access-key: ${MOMO_ACCESS_KEY:}
  secret-key: ${MOMO_SECRET_KEY:}
  request-type: ${MOMO_REQUEST_TYPE:payWithMethod}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8081/identity/payments/momo/ipn}

ghtk:
  token: ${GHTK_TOKEN:}
  client-source: ${GHTK_CLIENT_SOURCE:}
  base-url: ${GHTK_BASE_URL:https://services.giaohangtietkiem.vn}
  pick-province: ${GHTK_PICK_PROVINCE:}
  pick-ward: ${GHTK_PICK_WARD:}
  pick-district: ${GHTK_PICK_DISTRICT:}
  pick-address: ${GHTK_PICK_ADDRESS:}
  transport: ${GHTK_TRANSPORT:road}

ghn:
  token: ${TOKEN_API_GHN:}
  shop-id: ${GHN_SHOP_ID:}
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
  from-district-id: ${GHN_FROM_DISTRICT_ID:}
  service-type-id: ${GHN_SERVICE_TYPE_ID:2}
  default-length: ${GHN_DEFAULT_LENGTH:25}
  default-width: ${GHN_DEFAULT_WIDTH:20}
  default-height: ${GHN_DEFAULT_HEIGHT:10}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
