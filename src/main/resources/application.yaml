server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/identity}

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/identity_service}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
    driver-class-name: "${DB_DRIVER:com.mysql.cj.jdbc.Driver}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${HIBERNATE_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  mvc:
    view:
      prefix: /views/
      suffix: .jsp

jwt:
  signerKey: "${JWT_SIGNER_KEY:ErVMH45SIHtSBkDCaQX9su4z2IaTgU0kAJj+oqW/NYjOmHkQ6CH1l7ZDPlJGItUm}"

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
