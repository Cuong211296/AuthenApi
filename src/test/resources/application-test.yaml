spring:
  datasource:
    url: "jdbc:h2:mem:${random.uuid};MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025

jwt:
  signerKey: "test-signer-key-test-signer-key-test-signer-key-test-signer-key-0123456789"

shop:
  admin-password: "Admin#12345"
  expiry-job-interval-ms: 3600000
  expiry-job-initial-delay-ms: 3600000

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

momo:
  endpoint: https://test-payment.momo.vn
  partner-code: PARTNER
  access-key: ACCESS
  secret-key: SECRET
  request-type: payWithMethod
  ipn-url: http://localhost:8081/identity/payments/momo/ipn
